<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: url('https://p4.wallpaperbetter.com/wallpaper/44/92/27/blue-travel-sunbed-best-hotels-of-2017-wallpaper-preview.jpg') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding-top: 70px;
        }
        .navbar {
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
        }
        .navbar-brand {
            font-size: 24px;
            font-weight: bold;
            color: white;
        }
        .navbar-nav {
            margin-left: auto;
        }
        .nav-link {
            color: white;
            font-weight: bold;
            transition: 0.3s;
        }
        .nav-link:hover {
            color: #90caf9;
        }
        .container-form {
            max-width: 450px;
            width: 90%;
            margin: auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #90caf9;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        h2 {
            text-align: center;
            color: #1565c0;
            margin-bottom: 20px;
        }
        .btn-primary {
            background-color: #1e88e5;
            border: none;
            width: 100%;
        }
        .btn-primary:hover {
            background-color: #1565c0;
        }
        .btn-secondary {
            background-color: gray;
            border: none;
            width: 100%;
        }
        footer {
            background: black;
            color: white;
            text-align: center;
            padding: 10px;
            position: relative;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#">HOTEL BOOKING</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Services</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Reviews</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-form mt-5">
        <h2>Hotel Booking Form</h2>
        <form id="bookingForm">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" id="fullName" pattern="^[A-Za-z\s]+$" title="Name should not contain numbers or special characters" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="tel" class="form-control" placeholder="+91 XXXXXXXXXX" pattern="^\+91\s?[0-9]{10}$" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Address</label>
                <textarea class="form-control" rows="2" placeholder="Enter your full address..." required></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Check-in Date</label>
                <input type="date" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Check-out Date</label>
                <input type="date" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Room Type</label>
                <select class="form-select" required>
                    <option selected disabled>Select</option>
                    <option>Single Room</option>
                    <option>Double Room</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Number of Guests</label>
                <input type="number" class="form-control" min="1" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Food Preference</label>
                <select class="form-select" required>
                    <option selected disabled>Select</option>
                    <option>Vegetarian</option>
                    <option>Non-Vegetarian</option>
                    <option>Vegan</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Guide Required?</label>
                <select class="form-select" required>
                    <option selected disabled>Select</option>
                    <option>Yes</option>
                    <option>No</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Pickup & Drop Service</label>
                <select class="form-select" required>
                    <option selected disabled>Select</option>
                    <option>Yes</option>
                    <option>No</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Payment Method</label>
                <select class="form-select" required>
                    <option selected disabled>Select</option>
                    <option>Credit/Debit Card</option>
                    <option>Cash on Arrival</option>
                </select>
            </div>
            <div class="mb-3">
                <input type="checkbox" id="terms" required>
                <label for="terms">I agree to the hotel's terms & conditions</label>
            </div>
            <button type="submit" class="btn btn-primary">Book Now</button>
            <button type="reset" class="btn btn-secondary mt-2">Reset</button>
        </form>
    </div>

    <footer>
        <p>© 2025 Luxury Stay - Hotel Booking</p>
    </footer>

    <script>
        document.getElementById("bookingForm").addEventListener("submit", function(event) {
            const fullName = document.getElementById("fullName").value;
            const namePattern = /^[A-Za-z\s]+$/;

            if (!namePattern.test(fullName)) {
                alert("Full Name should not contain numbers or special characters.");
                event.preventDefault();
                return;
            }

            alert("Your hotel booking has been submitted successfully!");
            this.reset();
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
