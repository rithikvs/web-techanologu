<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Personal Info CRUD</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      padding: 20px;
      background: linear-gradient(to right, #74ebd5, #acb6e5);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    h2, h4 {
      color: #003366;
      font-weight: 600;
    }

    .form-label {
      font-weight: 500;
    }

    .btn-success {
      background-color: #28a745;
      border: none;
    }

    .btn-success:hover {
      background-color: #218838;
    }

    .btn-secondary:hover {
      background-color: #6c757d;
    }

    .btn-primary:hover {
      background-color: #0056b3;
    }

    .btn-danger:hover {
      background-color: #c82333;
    }

    .container {
      background: white;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
      padding: 30px;
    }

    table {
      margin-top: 20px;
    }

    table thead {
      background-color: #003366;
      color: white;
    }

    table tbody tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    .btn {
      border-radius: 20px;
      transition: all 0.3s ease;
    }

    input.form-control {
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="mb-4 text-center">Personal Information</h2>
    <form id="personForm" class="row g-3">
      <input type="hidden" id="personId">
      <div class="col-md-4">
        <label for="name" class="form-label">Name</label>
        <input type="text" class="form-control" id="name" required>
      </div>
      <div class="col-md-4">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required>
      </div>
      <div class="col-md-4">
        <label for="phone" class="form-label">Phone</label>
        <input type="tel" class="form-control" id="phone" required>
      </div>
      <div class="col-12 d-flex justify-content-center gap-3">
        <button type="submit" class="btn btn-success px-4"> Save</button>
        <button type="reset" class="btn btn-secondary px-4" onclick="resetForm()"> Clear</button>
      </div>
    </form>

    <hr>

    <h4 class="mt-4 text-center"> Records</h4>
    <table class="table table-bordered text-center" id="personTable">
      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="personBody"></tbody>
    </table>
  </div>

  <script>
    let people = [];
    let editIndex = null;

    document.getElementById("personForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const phone = document.getElementById("phone").value;

      if (editIndex !== null) {
        people[editIndex] = { name, email, phone };
        editIndex = null;
      } else {
        people.push({ name, email, phone });
      }

      renderTable();
      this.reset();
    });

    function renderTable() {
      const tbody = document.getElementById("personBody");
      tbody.innerHTML = "";
      people.forEach((person, index) => {
        const row = `<tr>
          <td>${index + 1}</td>
          <td>${person.name}</td>
          <td>${person.email}</td>
          <td>${person.phone}</td>
          <td>
            <button class="btn btn-primary btn-sm" onclick="editPerson(${index})"> Edit</button>
            <button class="btn btn-danger btn-sm" onclick="deletePerson(${index})"> Delete</button>
          </td>
        </tr>`;
        tbody.innerHTML += row;
      });
    }

    function editPerson(index) {
      const person = people[index];
      document.getElementById("name").value = person.name;
      document.getElementById("email").value = person.email;
      document.getElementById("phone").value = person.phone;
      editIndex = index;
    }

    function deletePerson(index) {
      if (confirm("Are you sure you want to delete this record?")) {
        people.splice(index, 1);
        renderTable();
      }
    }

    function resetForm() {
      editIndex = null;
    }
  </script>
</body>
</html>
